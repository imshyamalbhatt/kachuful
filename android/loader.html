<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#082116">
<title>Kachuful</title>
<style>html,body{margin:0;background:#082116}</style>
</head>
<body>
<script>
// Kachuful loader. Ships inside the APK as index.html; the app itself ships as app.html.
// At launch it fetches the live app code from GitHub Pages (waiting at most 1.5 s) so updates
// apply without a new APK, and falls back to the last downloaded copy (localStorage) or the
// copy bundled in the APK when offline. The origin never changes, so saved games are untouched.
(function () {
  var REMOTE = 'https://imshyamalbhatt.github.io/kachuful/index.html';
  var CODE = 'kachuful.code', BOOT = 'kachuful.boot', BAD = 'kachuful.bad';
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function valid(h) { return typeof h === 'string' && h.indexOf('data-app="kachuful"') > -1 && /<\/html>\s*$/i.test(h); }

  // The app sets BOOT to 'ok' once it has rendered. Still 'pending' means the
  // downloaded version crashed last time: remember it as bad and use the bundled copy.
  if (get(BOOT) === 'pending' && get(CODE)) { set(BAD, get(CODE)); del(CODE); }

  function run(html) {
    set(BOOT, 'pending');
    document.open(); document.write(html); document.close();
  }
  function fallback() {
    var cached = get(CODE);
    if (valid(cached)) run(cached);
    else fetch('app.html').then(function (r) { return r.text(); }).then(run);
  }
  var done = false;
  var timer = setTimeout(function () { if (!done) { done = true; fallback(); } }, 1500); // slow network: don't wait
  fetch(REMOTE + '?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.text() : null; })
    .then(function (h) {
      if (valid(h) && h !== get(BAD)) {
        set(CODE, h);
        if (!done) { done = true; clearTimeout(timer); run(h); }
      } else if (!done) { done = true; clearTimeout(timer); fallback(); }
    })
    .catch(function () { if (!done) { done = true; clearTimeout(timer); fallback(); } });
})();
</script>
</body>
</html>
